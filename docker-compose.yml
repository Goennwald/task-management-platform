services:
    postgres:
        image: postgres:18
        environment:
            POSTGRES_USER: taskmanagement
            POSTGRES_PASSWORD: taskmanagement
            POSTGRES_DB: taskmanagement
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U taskmanagement -d taskmanagement"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
